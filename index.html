<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pelada do Jonas e Amigos</title>
  <style>
    :root{--green:#0b6b4f;--green2:#073d31;--mint:#e4f6ef;--ink:#15231e;--muted:#697870;--line:#dce8e2;--paper:#fff;--bg:#f1f5f2;--red:#bb3546;--gold:#d9a32f;--shadow:0 14px 38px rgba(14,55,42,.09)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#e0efe8 0,transparent 28%),var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:272px 1fr}.side{background:linear-gradient(165deg,#0b5d47 0%,#052e27 65%,#031f1a 100%);color:#fff;padding:27px 20px;position:sticky;top:0;height:100vh;box-shadow:12px 0 35px rgba(2,35,28,.12);display:flex;flex-direction:column;overflow:hidden}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:18px;margin:0 7px 26px;letter-spacing:-.2px}.ball{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#fff,#dff4ea);color:var(--green2);box-shadow:0 8px 22px #0003;font-size:20px}.side-art{margin-top:auto;position:relative;border-radius:18px;overflow:hidden;border:1px solid #ffffff24;box-shadow:0 15px 38px #0005;height:min(48vh,430px);min-height:270px}.side-art img{width:100%;height:100%;object-fit:cover;object-position:center 48%;display:block}.side-art:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 52%,rgba(2,23,18,.82))}.side-art-label{position:absolute;z-index:1;left:15px;right:15px;bottom:14px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#e9fff6}nav button{width:100%;border:1px solid transparent;background:transparent;color:#c8ddd5;text-align:left;padding:13px 14px;border-radius:12px;margin:4px 0;cursor:pointer;transition:.18s}nav button.active,nav button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.08);color:#fff;transform:translateX(2px)}.main{padding:34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:27px}.top h1{margin:0;font-size:29px;letter-spacing:-.7px}.sub{color:var(--muted);margin-top:5px}.period{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);padding:7px 8px 7px 13px;border-radius:13px;box-shadow:0 8px 25px rgba(20,55,42,.06)}.period label{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}.period select{min-width:185px;border:0;background:var(--mint);font-weight:700}.card{background:linear-gradient(145deg,#fff 0%,#fcfefd 100%);border:1px solid rgba(210,226,218,.9);border-radius:18px;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{padding:21px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:75px;height:75px;border-radius:50%;right:-28px;top:-28px;background:var(--mint)}.stat small{color:var(--muted);display:block;font-weight:650}.stat strong{display:block;font-size:25px;margin-top:9px;letter-spacing:-.5px}.stat.balance{background:linear-gradient(135deg,#0a7454,#064a3b);color:white;border:0}.stat.balance:after{background:#ffffff14}.stat.balance small{color:#cce7dc}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;margin-top:18px}.box{padding:22px}.box h2{font-size:17px;margin:0 0 18px;letter-spacing:-.2px}.barrow{display:grid;grid-template-columns:105px 1fr 95px;gap:10px;align-items:center;margin:14px 0}.track{height:9px;background:#edf2ef;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#0a7454,#26a376);border-radius:10px}.fill.red{background:linear-gradient(90deg,#b72f42,#e06a73)}.quick{display:grid;gap:10px}.quick button,.primary,.ghost,.danger{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:700;transition:.18s}.quick button:hover,.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(11,107,79,.2)}.quick button,.primary{background:linear-gradient(135deg,#0b7455,#07513f);color:#fff}.ghost{background:#edf5f1;color:var(--green2)}.danger{background:#fff0f1;color:var(--red)}.section{display:none}.section.active{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:.45;transform:translateY(3px)}to{opacity:1;transform:none}}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px;flex-wrap:wrap}.toolbar input{min-width:230px}.field,input,select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);outline:none}.field:focus,input:focus,select:focus{border-color:#56a88c;box-shadow:0 0 0 3px #dff3eb}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}tbody tr:hover{background:#f8fbf9}th{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:var(--muted)}td:last-child,th:last-child{text-align:right}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--mint);color:var(--green2);font-size:12px;font-weight:650}.tag.out{background:#fff0f0;color:var(--red)}.empty{text-align:center!important;color:var(--muted);padding:38px!important}.modal{position:fixed;inset:0;background:rgba(3,25,19,.64);backdrop-filter:blur(5px);display:none;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.dialog{background:#fff;width:min(540px,100%);border-radius:20px;padding:24px;box-shadow:0 28px 80px #0005}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0;letter-spacing:-.4px}.close{border:0;background:none;font-size:25px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:21px}.form label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:600}.form .full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted);margin:-3px 0 2px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.toast{position:fixed;right:25px;bottom:25px;background:#14231d;color:white;padding:13px 18px;border-radius:11px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;box-shadow:0 10px 30px #0003}.toast.show{opacity:1;transform:none}.mobile-nav{display:none}.positive{color:var(--green)}.negative{color:var(--red)}
    .sports-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;margin-top:18px}.ranking-card{position:relative;overflow:hidden;border-top:5px solid var(--green);box-shadow:0 17px 42px rgba(14,55,42,.12)}.ranking-card.scorers{border-top-color:#d9a32f}.ranking-card.cards{border-top-color:#e4b52d}.ranking-card.keepers{border-top-color:#267eaa}.ranking-head{display:flex;align-items:center;gap:12px;padding-bottom:15px;margin-bottom:5px;border-bottom:1px solid var(--line)}.ranking-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--mint);font-size:23px;box-shadow:inset 0 0 0 1px #d5e9e0}.ranking-card.scorers .ranking-icon{background:#fff4d6}.ranking-card.cards .ranking-icon{background:#fff7d9}.ranking-card.keepers .ranking-icon{background:#e5f3fa}.ranking-head h2{font-size:20px!important;margin:0!important}.ranking-kicker{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}.ranking{display:grid;gap:7px}.rank-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 9px;border-bottom:1px solid var(--line);border-radius:9px}.rank-row:last-child{border-bottom:0}.rank-row:hover{background:#f4faf7}.rank-pos{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;background:#edf5f1;color:var(--green2);font-size:12px;font-weight:800}.rank-pos.podium{background:linear-gradient(145deg,#f8dfa0,#d6a62f);color:#5d4307;box-shadow:0 4px 10px #d6a62f33}.rank-name{min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-value{font-weight:800;color:var(--green);white-space:nowrap}.rank-detail{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}.rank-toggle{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:#f6faf8;color:var(--green);font-weight:800;cursor:pointer;transition:.18s}.rank-toggle:hover{background:var(--mint);border-color:#bddbce}.rank-toggle[hidden]{display:none}
    @media(max-width:1100px){.sports-grid{grid-template-columns:1fr 1fr}.sports-grid>.card:first-child{grid-column:1/-1}}
    @media(max-width:900px){.app{display:block}.side{display:none}.main{padding:20px 14px 85px}.stats{grid-template-columns:1fr 1fr}.grid,.sports-grid{grid-template-columns:1fr}.sports-grid>.card:first-child{grid-column:auto}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:7px}.mobile-nav button{border:0;background:none;color:var(--muted);padding:8px;font-size:12px}.mobile-nav button.active{color:var(--green);font-weight:700}.top{align-items:flex-start;flex-direction:column}.period{width:100%}.period input{flex:1}}
    @media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat{padding:15px}.stat strong{font-size:20px}.table-wrap{overflow:auto}.form{grid-template-columns:1fr}.form .full{grid-column:auto}.toolbar input{min-width:100%;width:100%}.hide-mobile{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><span class="ball">⚽</span> Pelada do Jonas<br>e Amigos</div><nav id="desktopNav"></nav><div class="side-art"><img src="jogador-10-sidebar.png" alt="Jogador número 10 da Pelada do Jonas e Amigos"><div class="side-art-label">Nossa pelada, nossa história</div></div></aside>
  <main class="main">
    <header class="top"><div><h1 id="pageTitle">Estatísticas dos jogadores</h1><div class="sub" id="pageSub">Acompanhe artilharia, cartões e desempenho dos goleiros.</div></div></header>
    <section id="sports" class="section active"><div class="sports-grid"><div class="card box ranking-card scorers"><div class="ranking-head"><span class="ranking-icon">🏆</span><div><div class="ranking-kicker">Classificação</div><h2>Artilharia</h2></div></div><div class="ranking" id="scorersRanking"></div><button class="rank-toggle" id="scorersToggle" onclick="toggleRanking('scorers')" hidden></button></div><div class="card box ranking-card cards"><div class="ranking-head"><span class="ranking-icon">🟨</span><div><div class="ranking-kicker">Disciplina</div><h2>Cartões dos jogadores</h2></div></div><div class="ranking" id="cardsRanking"></div><button class="rank-toggle" id="cardsToggle" onclick="toggleRanking('cards')" hidden></button></div><div class="card box ranking-card keepers"><div class="ranking-head"><span class="ranking-icon">🧤</span><div><div class="ranking-kicker">Desempenho</div><h2>Goleiros</h2></div></div><div class="ranking" id="keepersRanking"></div><button class="rank-toggle" id="keepersToggle" onclick="toggleRanking('keepers')" hidden></button></div></div></section>
    <section id="players" class="section"><div class="toolbar"><input id="playerSearch" placeholder="Buscar mensalista..."></div><div class="card box table-wrap"><table><thead><tr><th>Jogador</th><th>Tipo</th><th>Contato</th></tr></thead><tbody id="playerRows"></tbody></table></div></section>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<script src="seed-data.js"></script>
<script>
const STORE='peladaEmDia_v1';
const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const nav=[['sports','Estatísticas dos jogadores','⚽'],['players','Lista de mensalistas','♟']];
const expenseCategories=['Aluguel do campo','Gelo','Frutas','Árbitro','Goleiros','Bolas','Outros'];
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{players:[],transactions:[],performances:[],imports:[]};state.performances=state.performances||[];state.imports=state.imports||[];if(window.PELADA_SEED&&!state.imports.includes(window.PELADA_SEED.version)){const seed=window.PELADA_SEED,merge=(target,source)=>{source.forEach(x=>{const i=target.findIndex(y=>y.id===x.id);if(i<0)target.push(x);else if(x.id.startsWith('xlsx-'))target[i]=x})};state.transactions=state.transactions.filter(x=>!x.id?.startsWith('xlsx-t-'));state.performances=state.performances.filter(x=>!x.id?.startsWith('xlsx-s-'));merge(state.players,seed.players);merge(state.transactions,seed.transactions);merge(state.performances,seed.performances);state.imports.push(seed.version);localStorage.setItem(STORE,JSON.stringify(state))}let currentForm=null,editingId=null;const rankingExpanded={scorers:false,cards:false,keepers:false};
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s); const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function persist(){localStorage.setItem(STORE,JSON.stringify(state));render()}
function escapeHtml(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function month(){return'all'} function inPeriod(){return true} function monthRows(){return[]}
function setupPeriods(){}
function renderNav(){const html=nav.map((n,i)=>`<button data-page="${n[0]}" class="${i===0?'active':''}">${n[2]} &nbsp;${n[1]}</button>`).join('');$('#desktopNav').innerHTML=html;$('#mobileNav').innerHTML=html;$$('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page))}
function showPage(page){$$('.section').forEach(s=>s.classList.toggle('active',s.id===page));$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const item=nav.find(n=>n[0]===page);$('#pageTitle').textContent=item[1];$('#pageSub').textContent=page==='players'?'Consulte os integrantes mensalistas da pelada.':'Acompanhe artilharia, cartões e desempenho dos goleiros.';render()}
function render(){renderPlayers();renderSports()}
function renderLatest(rows){$('#latestRows').innerHTML=rows.slice(0,6).map(t=>`<tr><td>${formatDate(t.date)}<br><b>${escapeHtml(t.description)}</b></td><td class="${t.kind==='income'?'positive':'negative'}">${t.kind==='income'?'+':'−'} ${money.format(t.amount)}</td></tr>`).join('')||'<tr><td class="empty">Nenhum lançamento neste mês.</td></tr>'}
function renderCategories(rows){const totals={};rows.forEach(t=>totals[t.category]=(totals[t.category]||0)+Number(t.amount));const max=Math.max(...Object.values(totals),1);$('#categories').innerHTML=Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><span>${escapeHtml(k)}</span><div class="track"><div class="fill red" style="width:${v/max*100}%"></div></div><b>${money.format(v)}</b></div>`).join('')||'<p class="sub">Nenhuma despesa neste mês.</p>'}
function renderPlayers(){const q=($('#playerSearch')?.value||'').toLowerCase(),rows=state.players.filter(p=>p.type==='Mensalista'&&p.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));$('#playerRows').innerHTML=rows.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b></td><td><span class="tag">Mensalista</span></td><td>${escapeHtml(p.phone||'—')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Nenhum mensalista encontrado.</td></tr>'}
function renderTransactions(rows){$('#transactionRows').innerHTML=rows.map(t=>`<tr><td>${formatDate(t.date)}</td><td><b>${escapeHtml(t.description)}</b></td><td>${escapeHtml(t.category)}</td><td><span class="tag ${t.kind==='expense'?'out':''}">${t.kind==='income'?'Entrada':'Despesa'}</span></td><td class="${t.kind==='income'?'positive':'negative'}"><b>${money.format(t.amount)}</b></td><td><button class="ghost" onclick="editTransaction('${t.id}')">Editar</button> <button class="danger" onclick="removeTransaction('${t.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum lançamento neste mês.</td></tr>'}
function toggleRanking(type){rankingExpanded[type]=!rankingExpanded[type];renderSports()}
function renderRanking(type,entries,rowHtml,emptyText){const visible=rankingExpanded[type]?entries:entries.slice(0,10),button=$(`#${type}Toggle`);$(`#${type}Ranking`).innerHTML=visible.map(rowHtml).join('')||`<p class="sub">${emptyText}</p>`;button.hidden=entries.length<=10;if(!button.hidden){button.textContent=rankingExpanded[type]?'Mostrar menos':`Ver todos (${entries.length})`;button.setAttribute('aria-expanded',String(rankingExpanded[type]))}}
function renderSports(){const rows=state.performances,grouped={};rows.forEach(x=>{const p=state.players.find(p=>p.id===x.playerId),name=p?.name||'Jogador removido',keeper=/goleiro/i.test(name)||Number(x.conceded)>0;grouped[name]=grouped[name]||{goals:0,yellow:0,blue:0,red:0,conceded:0,appearances:0};['goals','yellow','blue','red','conceded'].forEach(k=>grouped[name][k]+=Number(x[k]||0));if(keeper)grouped[name].appearances+=x.appearances===undefined?1:Number(x.appearances||0)});const entries=Object.entries(grouped),isKeeper=([name,v])=>/goleiro/i.test(name)||v.conceded>0,average=v=>v.appearances?v.conceded/v.appearances:0,rankRow=(name,value,detail,i)=>`<div class="rank-row"><span class="rank-pos ${i<3?'podium':''}">${i+1}º</span><div class="rank-name">${escapeHtml(name)}${detail?`<div class="rank-detail">${detail}</div>`:''}</div><span class="rank-value">${value}</span></div>`;const scorers=entries.filter(x=>!isKeeper(x)&&x[1].goals>0).sort((a,b)=>b[1].goals-a[1].goals);renderRanking('scorers',scorers,([name,v],i)=>rankRow(name,`${v.goals} gol${v.goals===1?'':'s'}`,'',i),'Nenhum gol registrado.');const cards=entries.filter(x=>!isKeeper(x)&&x[1].yellow+x[1].blue+x[1].red>0).sort((a,b)=>(b[1].yellow+b[1].blue+b[1].red)-(a[1].yellow+a[1].blue+a[1].red));renderRanking('cards',cards,([name,v],i)=>rankRow(name,`${v.yellow+v.blue+v.red}`,`🟨 ${v.yellow} &nbsp; 🟦 ${v.blue} &nbsp; 🟥 ${v.red}`,i),'Nenhum cartão registrado.');const keepers=entries.filter(isKeeper).sort((a,b)=>average(a[1])-average(b[1])||a[1].conceded-b[1].conceded);renderRanking('keepers',keepers,([name,v],i)=>rankRow(name,`${average(v).toFixed(2).replace('.',',')} média`,`${v.conceded} gols sofridos · ${v.appearances} pelada${v.appearances===1?'':'s'}`,i),'Nenhum goleiro registrado.')}
function formatDate(d){return d.split('-').reverse().join('/')}
function field(label,name,type='text',value='',extra='',full=''){return `<label class="${full}">${label}<input name="${name}" type="${type}" value="${escapeHtml(value)}" ${extra} required></label>`}
function openForm(type,data={}){currentForm=type;editingId=data.id||null;let html='';if(type==='player'){ $('#modalTitle').textContent=editingId?'Editar jogador':'Novo jogador';html=field('Nome','name','text',data.name||'','','full')+`<label>Tipo<select name="type" required><option ${data.type==='Mensalista'?'selected':''}>Mensalista</option><option ${data.type==='Diarista'?'selected':''}>Diarista</option></select></label>`+field('Telefone','phone','tel',data.phone||'','placeholder="(00) 00000-0000"');}else if(type==='performance'){const players=state.players.map(p=>`<option value="${p.id}" ${data.playerId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('');$('#modalTitle').textContent=editingId?'Editar atuação':'Registrar atuação';html=`<label class="full">Jogador<select name="playerId" required><option value="">Selecione...</option>${players}</select></label>${field('Data','date','date',data.date||new Date().toISOString().slice(0,10))}${field('Gols marcados','goals','number',data.goals??0,'min="0"')}${field('Cartões amarelos','yellow','number',data.yellow??0,'min="0"')}${field('Cartões azuis','blue','number',data.blue??0,'min="0"')}${field('Cartões vermelhos','red','number',data.red??0,'min="0"')}${field('Gols sofridos','conceded','number',data.conceded??0,'min="0"')}`;}else{const income=type==='income';$('#modalTitle').textContent=editingId?'Editar lançamento':income?'Registrar pagamento':'Registrar despesa';const players=state.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${data.playerId===p.id?'selected':''}>${escapeHtml(p.name)} — ${p.type}</option>`).join(''),members=state.players.filter(p=>p.type==='Mensalista').sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${data.invitedBy===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('');const cats=(income?['Mensalidade','Diária']:expenseCategories).map(c=>`<option ${data.category===c?'selected':''}>${c}</option>`).join('');html=income?`<label class="full">Jogador já cadastrado (opcional)<select name="playerId"><option value="">Selecione ou informe um novo diarista abaixo</option>${players}</select></label><label class="full">Nome do novo diarista<input name="guestName" value="${!data.playerId?escapeHtml(data.guestName||''):''}" placeholder="Ex.: João da Silva"></label><label class="full">Mensalista que convidou<select name="invitedBy"><option value="">Selecione para pagamentos de diaristas</option>${members}</select></label><p class="hint full">Novos diaristas serão cadastrados automaticamente. O convite é obrigatório para diaristas.</p><label>Categoria<select name="category">${cats}</select></label>${field('Valor (R$)','amount','number',data.amount||'','min="0.01" step="0.01"')}${field('Data','date','date',data.date||new Date().toISOString().slice(0,10))}${field('Observação','note','text',data.note||'','','full')}`:`<label class="full">Descrição<input name="description" value="${escapeHtml(data.description||'')}" required></label><label>Categoria<select name="category">${cats}</select></label>${field('Valor (R$)','amount','number',data.amount||'','min="0.01" step="0.01"')}${field('Data','date','date',data.date||new Date().toISOString().slice(0,10))}${field('Observação','note','text',data.note||'','','full')}`;}$('#formFields').innerHTML=html;$('#modal').classList.add('open')}
function closeForm(){$('#modal').classList.remove('open');$('#entryForm').reset()}
if($('#entryForm'))$('#entryForm').onsubmit=e=>{e.preventDefault()}
function editPlayer(i){openForm('player',state.players.find(x=>x.id===i))}function editTransaction(i){const t=state.transactions.find(x=>x.id===i);openForm(t.kind,t)}
function editPerformance(i){openForm('performance',state.performances.find(x=>x.id===i))}function removePerformance(i){if(confirm('Excluir esta atuação?')){state.performances=state.performances.filter(x=>x.id!==i);persist()}}
function removePlayer(i){if(confirm('Excluir este jogador? Os lançamentos existentes serão mantidos.')){state.players=state.players.filter(x=>x.id!==i);persist()}}
function removeTransaction(i){if(confirm('Excluir este lançamento?')){state.transactions=state.transactions.filter(x=>x.id!==i);persist()}}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('#playerSearch').oninput=renderPlayers;
renderNav();render();
</script>
</body>
</html>
